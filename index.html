<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Сканер склада</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #1f9d55; --warn: #e08a00; --err: #d93025;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  #who { color: var(--hint); font-size: 14px; }
  .muted { color: var(--hint); font-size: 14px; }

  /* список отгрузок */
  .ship { display: block; width: 100%; text-align: left; padding: 14px; margin-bottom: 8px; border: 0;
          border-radius: 12px; background: var(--bg2); color: var(--text); font-size: 16px; cursor: pointer; }
  .ship b { display: block; }

  /* экран отгрузки */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .top h2 { margin: 0; font-size: 18px; }
  .icon-btn { border: 0; background: var(--bg2); color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: 16px; }
  .seg { display: flex; background: var(--bg2); border-radius: 12px; padding: 4px; margin: 12px 0; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 10px; border-radius: 9px; font-size: 15px; }
  .seg button.on { background: var(--btn); color: var(--btn-text); font-weight: 600; }
  .progress { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
  .progress div { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  #scanBtn { width: 100%; padding: 20px; margin-top: 12px; border: 0; border-radius: 14px; background: var(--btn);
             color: var(--btn-text); font-size: 20px; font-weight: 600; }
  #scanBtn:disabled { opacity: .5; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; color: var(--hint); font-size: 14px; }

  #result { margin: 12px 0; padding: 14px; border-radius: 14px; background: var(--bg2); border-left: 6px solid var(--hint); }
  #result.new { border-color: var(--ok); }
  #result.duplicate { border-color: var(--warn); }
  #result.error { border-color: var(--err); }
  .notice-box { margin: 12px 0; padding: 14px; border-radius: 14px; background: var(--bg2); border-left: 6px solid var(--err); }
  #result .title { font-weight: 700; }
  #result .meta { color: var(--hint); font-size: 14px; margin-top: 4px; word-break: break-all; }

  form { display: flex; gap: 8px; margin: 12px 0; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 0;
                     background: var(--bg2); color: var(--text); font-size: 16px; }
  form button { padding: 12px 16px; border: 0; border-radius: 10px; background: var(--bg2); color: var(--text); font-size: 16px; }

  ul { list-style: none; padding: 0; margin: 8px 0 0; }
  li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 4px; border-bottom: 1px solid var(--bg2); font-size: 15px; cursor: pointer; }
  li .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hint);
             display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; }
  li.done .mark { background: var(--ok); border-color: var(--ok); }
  li .body { flex: 1; min-width: 0; }
  li .id { color: var(--hint); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  li .qty { flex: none; color: var(--hint); font-size: 14px; }
  li.rack { background: var(--bg2); border-radius: 8px; font-weight: 700; margin-top: 8px; }
  li.sum { font-weight: 600; }
  li.member, li.inrack { padding-left: 22px; }
  li.member.inrack { padding-left: 40px; }
</style>
</head>
<body>
<header>
  <h1>Склад</h1>
  <div id="who">…</div>
</header>

<div id="notice" hidden></div>

<!-- Экран 1: выбор отгрузки -->
<section id="listScreen" hidden>
  <div class="muted" style="margin-bottom:10px">Выберите отгрузку:</div>
  <div id="shipList"><div class="muted">Загрузка…</div></div>
</section>

<!-- Экран 2: сканирование -->
<section id="shipScreen" hidden>
  <div class="top">
    <div>
      <h2 id="shipNo"></h2>
      <div class="muted" id="shipProject"></div>
    </div>
    <button class="icon-btn" id="refreshBtn" title="Обновить">⟳</button>
  </div>

  <div class="seg">
    <button data-mode="load" class="on">Погрузка</button>
    <button data-mode="back">Возврат</button>
  </div>

  <div id="progressText" class="muted"></div>
  <div class="progress"><div id="progressBar"></div></div>

  <button id="scanBtn">📷 Сканировать</button>
  <label class="row"><input type="checkbox" id="continuous"> Непрерывное сканирование</label>

  <div id="result" hidden><div class="title"></div><div class="meta"></div></div>

  <form id="manual">
    <input type="text" id="manualInput" placeholder="ID вручную" autocomplete="off" autocapitalize="characters">
    <button type="submit">OK</button>
  </form>

  <label class="row"><input type="checkbox" id="onlyLeft"> Показывать только неотмеченное</label>
  <ul id="rows"></ul>
</section>

<script>
// ▼▼▼ Адрес веб-приложения Telegram-моста (заканчивается на /exec) ▼▼▼
const API_URL = 'https://script.google.com/macros/s/AKfycbzsuM7dDH57SD3Clq65DAnC22v93UiQ2rM6wMmJNCjNbVlMVegHAFLHeY7Am4o6FC6n/exec1';
// ▲▲▲

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const $ = (id) => document.getElementById(id);
let state = null;          // текущая отгрузка
let mode = 'load';         // 'load' — погрузка, 'back' — возврат
let queue = Promise.resolve();
let lastCode = '', lastTime = 0;

async function api(action, params) {
  const resp = await fetch(API_URL, {
    method: 'POST',   // тело уходит как text/plain — без preflight, который Apps Script не поддерживает
    body: JSON.stringify(Object.assign({ initData: tg.initData, action }, params || {}))
  });
  const j = await resp.json();
  if (!j.ok) { const e = new Error(j.error || 'Ошибка'); e.denied = j.denied; throw e; }
  return j.data;
}

function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }

function notice(text) {
  const n = $('notice');
  n.hidden = !text;
  n.innerHTML = '';
  if (text) {
    const box = document.createElement('div');
    box.className = 'notice-box';
    box.textContent = text;
    n.appendChild(box);
  }
}

function showResult(kind, title, meta) {
  const box = $('result');
  box.hidden = false;
  box.className = kind;
  box.querySelector('.title').textContent = title;
  box.querySelector('.meta').textContent = meta || '';
}

/* ---------- Экран выбора отгрузки ---------- */
async function showList() {
  state = null;
  $('shipScreen').hidden = true;
  $('listScreen').hidden = false;
  tg.BackButton.hide();
  const list = $('shipList');
  list.innerHTML = '<div class="muted">Загрузка…</div>';
  try {
    const items = await api('shipments');
    list.innerHTML = '';
    if (!items.length) { list.innerHTML = '<div class="muted">Нет отгрузок со статусом «Отгружена».</div>'; return; }
    items.forEach((s) => {
      const b = document.createElement('button');
      b.className = 'ship';
      const t = document.createElement('b'); t.textContent = s.no;
      const d = document.createElement('span'); d.className = 'muted';
      d.textContent = [s.project, s.date].filter(Boolean).join(' · ');
      b.append(t, d);
      b.onclick = () => openShipment(s.no);
      list.appendChild(b);
    });
  } catch (e) {
    list.innerHTML = '';
    notice(e.message === 'Failed to fetch' ? 'Нет связи с сервером. Проверьте интернет.' : e.message);
  }
}

/* ---------- Экран отгрузки ---------- */
async function openShipment(no) {
  $('listScreen').hidden = true;
  $('shipScreen').hidden = false;
  $('result').hidden = true;
  $('shipNo').textContent = no;
  $('shipProject').textContent = 'Загрузка…';
  $('rows').innerHTML = '';
  tg.BackButton.show();
  try {
    render(await api('shipment', { no }));
  } catch (e) {
    showResult('error', 'Не удалось открыть', e.message);
  }
}

function isDone(r) { return mode === 'load' ? r.load : r.back; }

function render(s) {
  state = s;
  $('shipNo').textContent = s.no;
  $('shipProject').textContent = s.project || '';

  const units = s.rows.filter((r) => r.id && r.kind !== 'rack');
  const done = units.filter(isDone).length;
  $('progressText').textContent = (mode === 'load' ? 'Погружено ' : 'Вернулось ') + done + ' из ' + units.length + ' ед.';
  $('progressBar').style.width = (units.length ? Math.round(done / units.length * 100) : 0) + '%';

  const onlyLeft = $('onlyLeft').checked;
  const ul = $('rows');
  ul.innerHTML = '';
  s.rows.forEach((r) => {
    if (!r.name && !r.id) return;
    const d = isDone(r);
    if (onlyLeft && d) return;
    const li = document.createElement('li');
    li.className = r.kind + (r.stack && r.kind !== 'rack' ? ' inrack' : '') + (d ? ' done' : '');
    li.innerHTML = '<span class="mark"></span><span class="body"><div class="name"></div><div class="id"></div></span><span class="qty"></span>';
    li.querySelector('.mark').textContent = d ? '✓' : '';
    li.querySelector('.name').textContent = r.name;
    li.querySelector('.id').textContent = r.id || '';
    li.querySelector('.qty').textContent = Number(r.qty) > 1 ? '×' + r.qty : '';
    li.onclick = () => toggleRow(r);
    ul.appendChild(li);
  });
}

function toggleRow(r) {
  const own = mode === 'load' ? r.g : r.h;
  const what = mode === 'load' ? 'погрузки' : 'возврата';
  tg.showConfirm((own ? 'Снять' : 'Поставить') + ' отметку ' + what + ':\n' + r.name + '?', (yes) => {
    if (!yes) return;
    queue = queue.then(async () => {
      try {
        render(await api('toggle', { no: state.no, row: r.row, mode }));
        haptic('success');
      } catch (e) {
        haptic('error');
        showResult('error', 'Не удалось изменить отметку', e.message);
      }
    });
  });
}

/* ---------- Сканирование ---------- */
function submit(code) {
  code = String(code || '').trim();
  if (!code || !state) return;
  const no = state.no, m = mode;
  showResult('', '⏳ ' + code, 'Отправка…');
  // сканы отправляются строго по очереди, чтобы не перепутать отметки
  queue = queue.then(async () => {
    try {
      const res = await api('scan', { no, code, mode: m });
      if (res.state && state && state.no === no) render(res.state);
      if (!res.ok) { haptic('error'); showResult('error', '❌ ' + res.msg, code); }
      else if (res.already) { haptic('warning'); showResult('duplicate', '⚠️ ' + res.msg, code); }
      else { haptic('success'); showResult('new', res.msg, code); }
    } catch (e) {
      haptic('error');
      showResult('error', '❌ Не записано: ' + code, e.message === 'Failed to fetch' ? 'Нет связи, отсканируйте ещё раз' : e.message);
    }
  });
}

function scan() {
  const continuous = $('continuous').checked;
  tg.showScanQrPopup({ text: continuous ? 'Сканируйте подряд. Закройте, когда закончите.' : 'Наведите камеру на QR-код' }, (text) => {
    if (!continuous) { submit(text); return true; }      // true — закрыть камеру
    const now = Date.now();
    if (text === lastCode && now - lastTime < 4000) return; // камера видит один код много раз подряд
    lastCode = text; lastTime = now;
    submit(text);
  });
}

/* ---------- Обработчики ---------- */
$('scanBtn').onclick = scan;
$('refreshBtn').onclick = () => state && openShipment(state.no);
$('onlyLeft').onchange = () => state && render(state);
document.querySelectorAll('.seg button').forEach((b) => {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
    $('result').hidden = true;
    if (state) render(state);
  };
});
$('manual').addEventListener('submit', (e) => {
  e.preventDefault();
  submit($('manualInput').value);
  $('manualInput').value = '';
  $('manualInput').blur();
});
tg.BackButton.onClick(showList);

/* ---------- Запуск ---------- */
(async () => {
  if (!tg.initData) { notice('Откройте сканер через кнопку в Telegram-боте.'); return; }
  if (!tg.isVersionAtLeast('6.4')) {
    $('scanBtn').disabled = true;
    $('scanBtn').textContent = 'Камера доступна только в Telegram на телефоне';
  }
  try {
    const me = await api('whoami');
    $('who').textContent = me.name;
    showList();
  } catch (e) {
    $('who').textContent = '';
    notice(e.message === 'Failed to fetch'
      ? 'Нет связи с сервером. Проверьте API_URL и что мост опубликован с доступом «Все».'
      : e.message);
  }
})();
</script>
</body>
</html>
